<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Arte — {{NOME}} | Grupo Ecovolt</title>
  <!-- Arte renderizada em imagem por scripts/gerar-assinatura.ps1. Coordenadas no
       tamanho da arte de referencia (1816 x 866); a captura sai em 1520 x 724. -->
  <style>
    @font-face { font-family: 'Montserrat'; src: url('{{MODELOS}}/tipos/Montserrat.ttf') format('truetype'); font-weight: 100 900; }
    @font-face { font-family: 'Open Sans'; src: url('{{MODELOS}}/tipos/OpenSans.ttf') format('truetype'); font-weight: 300 800; }
    html, body { margin: 0; padding: 0; background: #fefefe; overflow: hidden; }
    svg { display: block; width: 760px; height: 362px; }
    .nome { font: 700 70px 'Montserrat'; fill: #141414; }
    .cargo { font: 400 44px 'Montserrat'; fill: #585758; }
    .contato { font: 400 33px 'Open Sans'; fill: #1e1e1e; }
    .icone { fill: #88bc0c; }
    .icone-linha { fill: none; stroke: #88bc0c; stroke-width: 2; stroke-linejoin: round; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1816 866" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="1816" height="866" fill="#fefefe"/>
    <!-- Moldura vetorial (modelos/moldura.json): formas de fundo, foto na janela e,
         por cima, faixas verdes e filete branco cobrindo a borda da foto.
         A foto e multiplicada sobre cinza-claro para fundos brancos nao sumirem no cartao. -->
    {{MOLDURA_FUNDO}}
    <clipPath id="janela"><path d="{{JANELA}}"/></clipPath>
    <g clip-path="url(#janela)">
      <rect x="60" y="20" width="580" height="800" fill="#e6e6e6"/>
      <image href="{{FOTO}}" x="{{FOTO_X}}" y="{{FOTO_Y}}" width="{{FOTO_L}}" height="{{FOTO_A}}" preserveAspectRatio="xMidYMin slice" style="mix-blend-mode:multiply"/>
    </g>
    {{MOLDURA_FRENTE}}
    <image href="{{MODELOS}}/base.png" width="1816" height="866"/>
    <image href="{{LOGO}}" x="672" y="94" width="1000" height="225" preserveAspectRatio="xMinYMid meet"/>
    <text class="nome" x="658" y="430" data-max="658">{{NOME}}</text>
    <text class="cargo" x="660" y="477" data-max="658">{{CARGO}}</text>
    <rect x="661" y="499" width="100" height="8" rx="4" class="icone"/>
    <!-- Contatos: icones em caixa 24 x 24 ampliada para 36 px, linhas a cada 54 px. -->
    <g transform="translate(665 534) scale(1.5)">
      <path class="icone" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    </g>
    <g transform="translate(665 588) scale(1.5)">
      <rect class="icone-linha" x="2.5" y="5" width="19" height="14" rx="1.5"/>
      <path class="icone-linha" d="M3 6.5l9 6.5 9-6.5"/>
    </g>
    <g transform="translate(665 642) scale(1.5)">
      <circle class="icone-linha" cx="12" cy="12" r="9.5"/>
      <ellipse class="icone-linha" cx="12" cy="12" rx="4" ry="9.5"/>
      <path class="icone-linha" d="M2.5 12h19M4 7.5h16M4 16.5h16"/>
    </g>
    <g transform="translate(665 696) scale(1.5)">
      <path class="icone" d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
    </g>
    <text class="contato" x="738" y="563" data-max="582">{{TELEFONE}}</text>
    <text class="contato" x="738" y="617" data-max="582">{{EMAIL}}</text>
    <text class="contato" x="738" y="671" data-max="582">{{SITE}}</text>
    <text class="contato" x="738" y="725" data-max="582">CNPJ {{CNPJ}}</text>
  </svg>
  <script>
    // Reduz a fonte de textos longos para nao invadir a coluna de servicos.
    document.fonts.ready.then(function () {
      document.querySelectorAll('text[data-max]').forEach(function (t) {
        var max = Number(t.dataset.max), largura = t.getComputedTextLength();
        if (largura > max) {
          var tamanho = parseFloat(getComputedStyle(t).fontSize);
          t.style.fontSize = (tamanho * max / largura) + 'px';
        }
      });
    });
  </script>
</body>
</html>
