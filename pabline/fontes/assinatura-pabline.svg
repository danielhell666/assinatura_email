<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Assinatura de e-mail de Pabline Cavalcante</title>
  <desc id="descricao">Terapeuta Ocupacional Infantil, com telefone, e-mail, Instagram e atendimento clínico e domiciliar.</desc>
